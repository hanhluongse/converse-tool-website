<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite App</title>
  <link href="/src/styles.css" rel="stylesheet">
</head>

<body>
  <main class="flex flex-col justify-center items-center min-h-screen space-y-20 my-10">
    <div class="relative">
      <img src="./assets/bg.svg" alt="logo" />
      <img src="./assets/logo.svg" alt="logo" class="absolute right-0 top-0" />
    </div>
    <p class="text-3xl max-w-5xl">
      White
      atelierでは、真っ白なオールスターをあなた好みにカスタマイズすることができます。左右で違うデザインにしたり、アッパーとタンの組み合わせを変えたり、デザインのバリエーションは無限大。このアトリエで、世界にひとつ、あなただけのコンバースをデザインしてください。
    </p>
    <div class="flex flex-col space-y-17.5">
      <button class="py-6 px-20 uppercase bg-black text-white rounded-full">
        Standard Edition
      </button>
      <button class="py-6 px-20 uppercase bg-[#BE266D] text-white rounded-full">
        Limited Edition
      </button>
    </div>
    <div class="mt-20">
      <img src="./assets//converse.svg" alt="converse">
    </div>
  </main>
</body>

</html>

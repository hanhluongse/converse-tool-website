<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="/src/styles.css" rel="stylesheet">
</head>

<body>
  <nav class="flex w-full overflow-visible">
    <div class="step">
      スニーカーを選択
      <div class="arrow white-border"></div>
    </div>
    <div class="step">
      左足アッパー
      <div class="arrow white-border"></div>
    </div>
    <div class="step active">
      右足アッパー
      <div class="arrow"></div>
    </div>
    <div class="step">
      左足タン
      <div class="arrow white-border"></div>
    </div>
    <div class="step">
      右足タン
      <div class="arrow white-border"></div>
    </div>
    <div class="step">
      デザイン確認
      <div class="arrow white-border"></div>
    </div>
    <div class="step-end">
      スタッフ確認
    </div>
  </nav>
  <main class="@container mx-auto max-w-[1440px] my-10">
    <div class="flex justify-between items-center">
      <div class="">
        <span class="uppercase text-xl font-bold">phase.3</span>
        <span class="text-xl">右足のアッパーデザイン</span>
      </div>
      <div>
        <div class="flex items-end">
          <span class="uppercase">price</span>
          <span class="text-4xl">￥10,250</span>
        </div>
      </div>
    </div>
    <div class="relative flex justify-center bg-[#FAFAFA]">
      <img src="/assets/phase-3/phase-2-white-atelin.png" alt="Shoe" />
    </div>
    <div class="flex space-x-4">
      <button class="py-4 px-14 bg-white rounded-full text-black uppercase border border-black">Standard</button>
      <button class="py-4 px-14 bg-black rounded-full text-white uppercase border border-black">TYPOGRAPHY</button>
      <button class="py-4 px-14 bg-white rounded-full text-black uppercase border border-black">Name</button>
      <button class="py-4 px-14 bg-white rounded-full text-black uppercase border border-black">STICKER</button>
    </div>

    <div class="flex gap-[2%] flex-wrap justify-start space-y-10 mt-10">
      <div class="w-[10%] h-[23.5%]">
        <img src="/assets/phase-2/none.png" alt="" srcset="">
      </div>
      <div class="w-[10%] h-[23.5%]">
        <img src="/assets/phase-3/a-black.png" alt="" srcset="">
      </div>
      <div class="w-[10%] h-[23.5%]">
        <img src="/assets/phase-3/a-blue.png" alt="" srcset="">
      </div>
      <div class="w-[10%] h-[23.5%]">
        <img src="/assets/phase-3/a-yellow.png" alt="" srcset="">
      </div>
      <div class="w-[10%] h-[23.5%]">
        <img src="/assets/phase-3/a-red.png" alt="" srcset="" class="outline-black outline-2">
      </div>
      <div class="w-[10%] h-[23.5%]">
        <img src="/assets/phase-3/a-img.png" alt="" srcset="">
      </div>
    </div>
    <div class="flex flex-col justify-between space-y-6">
      <p class="text-2xl">テキストを入力(英数字1文字)</p>
      <input type="text" aria-label="text" class="outline-1 outline-red rounded-sm max-w-sm py-2 px-4" />
    </div>
    <section>
      <div>
        <p class="uppercase">Progress</p>
      </div>
      <div class="flex gap-[2%] flex-wrap justify-between items-center">
        <div class="bg-black w-[-23%] h-[25%]">
          <img src="/assets/phase-2/progress-1.png" alt="" srcset="">
        </div>
        <div class="bg-black w-[-23%] h-[25%]">
          <img src="/assets/phase-3/progress-2.png" alt="" srcset="">
        </div>
        <div class="bg-black w-[-23%] h-[25%]">
          <img src="/assets/phase-2/progress-3.png" alt="" srcset="">
        </div>
        <div class="bg-black w-[-23%] h-[25%]">
          <img src="/assets/phase-2/progress-3.png" alt="" srcset="">
        </div>
      </div>
      <div class="flex justify-end mt-4">
        <a href="/products-detail.html" class="bg-black py-4 px-20 text-white rounded-full">NEXT</a>
      </div>
    </section>
  </main>
</body>

</html>
